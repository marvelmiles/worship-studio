<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#07060e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />

    <title>{{APP_TITLE}}</title>
    <meta name="deion" content="{{APP_DESCRIPTION}}" />
    <meta
      name="keywords"
      content="worship presentation, church slides, lyrics to slides, bible projection, scripture slides, ProPresenter alternative, hymn projection, song library"
    />
    <meta name="author" content="{{APP_NAME}}" />
    <link rel="canonical" href="{{APP_URL}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{APP_NAME}}" />
    <meta property="og:title" content="{{APP_TITLE}}" />
    <meta property="og:description" content="{{APP_SHORT_DESCRIPTION}}" />
    <meta property="og:url" content="{{APP_URL}}" />
    <meta property="og:image" content="{{APP_URL}}icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="{{APP_NAME}} app icon" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{APP_TITLE}}" />
    <meta name="twitter:description" content="{{APP_SHORT_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{APP_URL}}icon-512.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "{{APP_NAME}}",
        "url": "{{APP_URL}}",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "Present lyrics, sermons, Bible passages, images and videos live from the browser, installable and offline-ready.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

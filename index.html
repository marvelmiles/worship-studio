<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#101013" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />

    <title>{{APP_TITLE}}</title>
    <meta name="description" content="{{APP_DESCRIPTION}}" />
    <meta
      name="keywords"
      content="worship presentation software, church presentation software, church slides, lyrics to slides, hymn projection, bible verse projection, scripture slides, sermon slides, ProPresenter alternative, EasyWorship alternative, OpenLP alternative, offline worship app, song library"
    />
    <meta name="author" content="{{APP_NAME}}" />
    <meta name="application-name" content="{{APP_NAME}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="{{APP_URL}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{APP_NAME}}" />
    <meta property="og:title" content="{{APP_TITLE}}" />
    <meta property="og:description" content="{{APP_SHORT_DESCRIPTION}}" />
    <meta property="og:url" content="{{APP_URL}}" />
    <meta property="og:image" content="{{APP_URL}}icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="{{APP_NAME}} app icon" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{APP_TITLE}}" />
    <meta name="twitter:description" content="{{APP_SHORT_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{APP_URL}}icon-512.png" />
    <meta name="twitter:image:alt" content="{{APP_NAME}} app icon" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "{{APP_NAME}}",
        "url": "{{APP_URL}}",
        "applicationCategory": "MultimediaApplication",
        "applicationSubCategory": "Presentation Software",
        "operatingSystem": "Web",
        "browserRequirements": "Requires a modern browser with IndexedDB support",
        "inLanguage": "en",
        "image": "{{APP_URL}}icon-512.png",
        "description": "Present lyrics, sermons, Bible passages, images and videos live from the browser, installable and offline-ready.",
        "featureList": [
          "Turn pasted lyrics, hymns and sermon outlines into slides",
          "Offline Bible (King James and American Standard versions)",
          "Full-screen projection to a second display over HDMI",
          "Themes, backgrounds, video backgrounds and looping audio",
          "Presenter notes, next-slide preview, timer and keyboard control",
          "Live phone cameras and overlays over a broadcast",
          "Device-to-device library sharing with no server",
          "Works offline and installs as a PWA"
        ],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
